<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bulk Image Editor AI - VAJRA</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <script src="page_permissions.js"></script>
  <script src="common-ui.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f3f5ef;
      --muted: #a6b0a7;
      --line: #35413b;
      --panel: #17211c;
      --bg: #101713;
      --lime: #c9f36a;
      --orange: #f2a56c;
      --red: #ff8179;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(ellipse at 85% 0%, #27372b 0, transparent 36%), var(--bg);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }
    button, input, textarea { font: inherit; }
    .shell { width: min(1320px, 100%); margin: auto; padding: 28px 22px 54px; }
    header { display: flex; justify-content: space-between; align-items: end; gap: 18px; margin-bottom: 24px; }
    h1 { margin: 0; font-size: 32px; line-height: 1.1; }
    header p { margin: 9px 0 0; color: var(--muted); font-size: 14px; }
    .count { color: var(--lime); font-size: 13px; font-weight: 700; white-space: nowrap; }
    .controls { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: end; padding: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    label { display: block; margin-bottom: 8px; color: #d4dccf; font-size: 12px; font-weight: 700; }
    textarea, .file-label { width: 100%; border: 1px solid var(--line); border-radius: 6px; background: #111a15; color: var(--ink); }
    textarea { min-height: 76px; padding: 12px; resize: vertical; }
    .actions { display: flex; gap: 9px; align-items: center; }
    .file-label { display: inline-flex; width: auto; min-height: 42px; align-items: center; justify-content: center; padding: 0 14px; cursor: pointer; font-size: 13px; }
    input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
    button { min-height: 42px; padding: 0 16px; border: 0; border-radius: 6px; background: var(--lime); color: #192114; font-weight: 800; cursor: pointer; }
    button.secondary { border: 1px solid var(--line); background: #202b24; color: var(--ink); }
    button:disabled { opacity: .48; cursor: not-allowed; }
    #status { min-height: 22px; margin-top: 12px; color: var(--muted); font-size: 13px; }
    #status.error { color: var(--red); }
    #status.success { color: var(--lime); }
    .queue { display: grid; grid-template-columns: repeat(auto-fill, minmax(245px, 1fr)); gap: 14px; margin-top: 22px; }
    .item { min-width: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
    .images { display: grid; grid-template-columns: 1fr 1fr; background: #0c110e; }
    .images figure { margin: 0; min-width: 0; }
    .images figure + figure { border-left: 1px solid var(--line); }
    .images img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: contain; }
    figcaption { padding: 7px 9px; color: var(--muted); font-size: 10px; text-transform: uppercase; }
    .item-body { padding: 12px; }
    .item-code { overflow-wrap: anywhere; font-size: 16px; font-weight: 800; }
    .item-name { min-height: 18px; margin-top: 4px; color: var(--muted); font-size: 12px; }
    .item-state { min-height: 18px; margin: 10px 0; color: var(--orange); font-size: 12px; }
    .item-state.error { color: var(--red); }
    .item-state.success { color: var(--lime); }
    .item button { width: 100%; min-height: 38px; }
    .empty { grid-column: 1 / -1; padding: 48px 20px; border: 1px dashed var(--line); color: var(--muted); text-align: center; }
    @media (max-width: 700px) {
      .shell { padding: 20px 14px 36px; }
      header { align-items: flex-start; flex-direction: column; }
      h1 { font-size: 27px; }
      .controls { grid-template-columns: 1fr; }
      .actions { flex-wrap: wrap; }
      .actions > * { flex: 1; }
      .queue { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
      .item-body { padding: 10px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <h1>Bulk Image Editor AI</h1>
        <p>Select product photos named with their item code, edit with Gemini, then upload approved results.</p>
      </div>
      <div class="count" id="stockCount">Loading stock...</div>
    </header>

    <section class="controls" aria-label="Image editing controls">
      <div>
        <label for="editPrompt">Editing instruction</label>
        <textarea id="editPrompt">Make this a clean product catalogue photo on a pure white background with soft studio lighting. Preserve the product's exact shape, color, finish, and details.</textarea>
      </div>
      <div class="actions">
        <label class="file-label" for="imageFiles">Choose images</label>
        <input id="imageFiles" type="file" accept="image/*" multiple />
        <button id="startButton" type="button" disabled>Start editing</button>
      </div>
    </section>
    <div id="status" role="status">Select images whose filename (without extension) matches the stock item code.</div>
    <section class="queue" id="queue" aria-live="polite">
      <div class="empty">Your selected product images will appear here.</div>
    </section>
  </main>

  <script>
    const sb = window.sbcc;
    const stockByCode = new Map();
    const queueItems = [];
    const queueEl = document.getElementById("queue");
    const statusEl = document.getElementById("status");
    const startButton = document.getElementById("startButton");
    const imageFiles = document.getElementById("imageFiles");
    const cloudinary = { name: "dhjrnv1ba", preset: "vajra_unsigned", folder: "vajra-products" };

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = type;
    }

    function getApiEndpoint() {
      const configured = window.AI_CATALOG_API_URL || localStorage.getItem("AI_CATALOG_API_URL");
      if (configured) {
        const apiOrigin = configured.replace(/\/api\/(?:ai-catalog-page|ai-bulk-image-edit)\/?$/, "").replace(/\/$/, "");
        return `${apiOrigin}/api/ai-bulk-image-edit`;
      }
      if (["http:", "https:"].includes(location.protocol)) {
        const local = ["localhost", "127.0.0.1", "::1"].includes(location.hostname);
        const origin = local
          ? (location.port && location.port !== "3000" ? `${location.protocol}//localhost:3000` : location.origin)
          : "https://nserp-vajra-voice-api.onrender.com";
        return `${origin}/api/ai-bulk-image-edit`;
      }
      return "http://localhost:3000/api/ai-bulk-image-edit";
    }

    async function loadStock() {
      if (!sb) throw new Error("Supabase client did not initialize");
      const access = await requirePageAccess("crm");
      if (!access) return false;
      let offset = 0;
      const pageSize = 1000;
      while (true) {
        const { data, error } = await sb.from("stock_items").select("item_code,item_name").order("item_code").range(offset, offset + pageSize - 1);
        if (error) throw error;
        for (const item of data || []) stockByCode.set(String(item.item_code || "").trim().toUpperCase(), item);
        if (!data || data.length < pageSize) break;
        offset += pageSize;
      }
      document.getElementById("stockCount").textContent = `${stockByCode.size.toLocaleString("en-IN")} stock items`;
      return true;
    }

    function makeCard(entry) {
      const card = document.createElement("article");
      card.className = "item";
      const inputUrl = URL.createObjectURL(entry.sourceFile);
      card.innerHTML = `<div class="images">
        <figure><img src="${inputUrl}" alt="Original ${escapeHtml(entry.code)}"><figcaption>Original</figcaption></figure>
        <figure><img alt="Edited ${escapeHtml(entry.code)}"><figcaption>Edited</figcaption></figure>
      </div><div class="item-body">
        <div class="item-code">${escapeHtml(entry.code)}</div>
        <div class="item-name">${escapeHtml(entry.stock?.item_name || "No matching stock item")}</div>
        <div class="item-state ${entry.stock ? "" : "error"}">${entry.stock ? "Ready" : "Item code not found in stock"}</div>
        <button type="button" disabled>Upload image</button>
      </div>`;
      entry.card = card;
      entry.stateEl = card.querySelector(".item-state");
      entry.resultImage = card.querySelectorAll("img")[1];
      entry.uploadButton = card.querySelector("button");
      entry.uploadButton.addEventListener("click", () => uploadResult(entry));
      return card;
    }

    function escapeHtml(value) {
      return String(value || "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    }

    imageFiles.addEventListener("change", () => {
      for (const file of imageFiles.files || []) {
        if (!file.type.startsWith("image/")) continue;
        const code = file.name.replace(/\.[^.]+$/, "").trim();
        const stock = stockByCode.get(code.toUpperCase());
        const entry = { code: stock?.item_code || code, stock, sourceFile: file, resultFile: null };
        queueItems.push(entry);
        if (queueItems.length === 1) queueEl.replaceChildren();
        queueEl.append(makeCard(entry));
      }
      startButton.disabled = !queueItems.some(item => item.stock && !item.resultFile);
      if (queueItems.length) setStatus(`${queueItems.length} image(s) in the editing queue.`);
      imageFiles.value = "";
    });

    async function compressImage(file) {
      const bitmap = await createImageBitmap(file);
      const scale = Math.min(1, 1400 / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();
      const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.84));
      if (!blob) throw new Error("Could not prepare image");
      return blob;
    }

    async function getAuthHeaders() {
      const { data } = await sb.auth.getSession();
      const token = data?.session?.access_token;
      if (!token) throw new Error("Sign in again to edit product images");
      return { "Content-Type": "application/json", Authorization: `Bearer ${token}` };
    }

    async function editEntry(entry) {
      entry.stateEl.textContent = "Compressing and sending to Gemini...";
      entry.stateEl.className = "item-state";
      const blob = await compressImage(entry.sourceFile);
      const imageBase64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(String(reader.result).split(",")[1]);
        reader.onerror = () => reject(new Error("Could not read image"));
        reader.readAsDataURL(blob);
      });
      const response = await fetch(getApiEndpoint(), {
        method: "POST",
        headers: await getAuthHeaders(),
        body: JSON.stringify({ itemCode: entry.code, prompt: document.getElementById("editPrompt").value, imageBase64, mimeType: "image/jpeg" })
      });
      const responseText = await response.text();
      let result = {};
      try {
        result = responseText ? JSON.parse(responseText) : {};
      } catch (_) {
        result = {};
      }
      if (!response.ok) {
        const detail = result.error || responseText.slice(0, 300).trim();
        throw new Error(detail || `Image edit request failed (${response.status} ${response.statusText})`);
      }
      if (!result.imageBase64) throw new Error("Image edit service returned no image data");
      const mimeType = result.mimeType || "image/png";
      const bytes = Uint8Array.from(atob(result.imageBase64), char => char.charCodeAt(0));
      entry.resultFile = new File([bytes], `${entry.code}.${mimeType.split("/")[1] || "png"}`, { type: mimeType });
      entry.resultImage.src = URL.createObjectURL(entry.resultFile);
      entry.stateEl.textContent = "Edited. Review, then upload.";
      entry.stateEl.className = "item-state success";
      entry.uploadButton.disabled = false;
    }

    startButton.addEventListener("click", async () => {
      startButton.disabled = true;
      const pending = queueItems.filter(item => item.stock && !item.resultFile);
      let completed = 0;
      for (const entry of pending) {
        try {
          await editEntry(entry);
        } catch (error) {
          entry.stateEl.textContent = error.message || "Image edit failed";
          entry.stateEl.className = "item-state error";
        }
        completed += 1;
        setStatus(`Edited ${completed} of ${pending.length} queued images.`);
      }
      startButton.disabled = !queueItems.some(item => item.stock && !item.resultFile);
      setStatus(`Editing complete. ${queueItems.filter(item => item.resultFile).length} image(s) ready to upload.`, "success");
    });

    async function uploadResult(entry) {
      entry.uploadButton.disabled = true;
      entry.stateEl.textContent = "Uploading to Cloudinary...";
      entry.stateEl.className = "item-state";
      try {
        const formData = new FormData();
        formData.append("file", entry.resultFile);
        formData.append("upload_preset", cloudinary.preset);
        formData.append("folder", cloudinary.folder);
        formData.append("public_id", `${entry.code}_${Date.now()}`.replace(/[^a-zA-Z0-9_-]/g, "_"));
        const uploadResponse = await fetch(`https://api.cloudinary.com/v1_1/${cloudinary.name}/image/upload`, { method: "POST", body: formData });
        const uploadResult = await uploadResponse.json();
        if (!uploadResponse.ok) throw new Error(uploadResult.error?.message || "Cloudinary upload failed");
        const { error } = await sb.from("stock_items").update({
          product_image_url: uploadResult.secure_url,
          product_image_alt: entry.stock.item_name || entry.code,
          product_image_updated_at: new Date().toISOString()
        }).eq("item_code", entry.stock.item_code);
        if (error) throw error;
        entry.stateEl.textContent = "Uploaded and saved to stock.";
        entry.stateEl.className = "item-state success";
        entry.uploadButton.textContent = "Uploaded";
      } catch (error) {
        entry.stateEl.textContent = error.message || "Upload failed";
        entry.stateEl.className = "item-state error";
        entry.uploadButton.disabled = false;
      }
    }

    loadStock().then(loaded => {
      if (loaded) setStatus("Stock loaded. Choose images named with their item code.");
    }).catch(error => {
      document.getElementById("stockCount").textContent = "Stock unavailable";
      setStatus(`Could not load stock: ${error.message}`, "error");
    });
  </script>
</body>
</html>
