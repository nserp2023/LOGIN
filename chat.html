<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock &amp; Price Chat</title><link rel="icon" href="favicon.ico"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabaseClient.js"></script><style>
:root{--ink:#eaf2ff;--muted:#9eafc9;--line:#ffffff20}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Segoe UI,Arial,sans-serif;color:var(--ink);background:radial-gradient(circle at top left,#1c427b,#0a1222 48%,#060b15)}.page{width:min(1100px,calc(100% - 28px));margin:auto;padding:24px 0 32px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}.brand{display:flex;gap:13px;align-items:center}.brand-icon{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-size:23px;background:linear-gradient(135deg,#7c3aed,#2563eb)}h1{font-size:21px;margin:0}.top p{font-size:13px;color:var(--muted);margin:4px 0 0}.back{color:white;text-decoration:none;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#ffffff10;font-weight:700}.chat{height:calc(100vh - 150px);min-height:570px;display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:22px;background:#101c30df;box-shadow:0 22px 50px #0006}.messages{flex:1;overflow:auto;padding:22px}.message{display:flex;gap:10px;align-items:flex-start;margin-bottom:18px}.message.user{justify-content:flex-end}.avatar{width:33px;height:33px;flex:0 0 33px;border-radius:50%;display:grid;place-items:center;background:#2463bb}.bubble{max-width:min(780px,88%);padding:13px 16px;border-radius:5px 17px 17px;background:#ffffff0d;line-height:1.45}.user .bubble{background:linear-gradient(135deg,#286ee4,#2257bb);border-radius:17px 5px 17px 17px}.bubble p{margin:0}.help{color:var(--muted);font-size:14px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.chip{border:1px solid #6794e555;color:#cfe0ff;background:#3266ae22;border-radius:999px;padding:7px 11px;cursor:pointer;font:inherit;font-size:13px}.results{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin-top:12px}.item-card{overflow:hidden;border:1px solid #6d92c440;border-radius:14px;background:#081222a8}.item-card h3{font-size:14px;margin:0;padding:12px 13px;background:#ffffff0a;word-break:break-word}.item-card table{width:100%;border-collapse:collapse;font-size:13px}.item-card th,.item-card td{padding:8px 12px;border-top:1px solid #ffffff12;text-align:left}.item-card th{color:#9cb0cd;font-weight:600;width:43%}.stock-ok{color:#70e69a;font-weight:800}.stock-out{color:#ff9292;font-weight:800}.status{padding:10px 14px;color:var(--muted);font-size:13px;border-top:1px solid var(--line);display:none}.composer{display:flex;gap:10px;padding:14px;border-top:1px solid var(--line);background:#07101ddd}.composer input{min-width:0;flex:1;padding:14px 16px;border:1px solid #ffffff25;border-radius:14px;color:#fff;background:#ffffff0b;font:inherit;outline:none}.composer input:focus{border-color:#6097ff}.composer button{border:0;border-radius:14px;padding:0 19px;background:linear-gradient(135deg,#4f8cff,#2563eb);font:inherit;font-weight:800;color:#fff;cursor:pointer}.composer button:disabled{opacity:.6}@media(max-width:600px){.page{width:calc(100% - 16px);padding-top:12px}.top{margin-bottom:12px}.brand h1{font-size:17px}.back{padding:9px 10px;font-size:13px}.chat{height:calc(100vh - 106px);min-height:500px;border-radius:16px}.messages{padding:15px}.composer{padding:10px}.composer button{padding:0 14px}.results{grid-template-columns:1fr}}
</style></head><body><main class="page"><header class="top"><div class="brand"><div class="brand-icon">💬</div><div><h1>Stock &amp; Price Chat</h1><p>Ask about any item in your sales inventory</p></div></div><a class="back" href="dashboard.html">← Dashboard</a></header><section class="chat"><div id="messages" class="messages" aria-live="polite"></div><div id="status" class="status"></div><form id="chatForm" class="composer"><input id="query" autocomplete="off" placeholder="Type item name, code, barcode or department…" aria-label="Item search"><button id="send" type="submit">Send</button></form></section></main><script>
const messages=document.querySelector('#messages'),form=document.querySelector('#chatForm'),query=document.querySelector('#query'),send=document.querySelector('#send'),status=document.querySelector('#status');let inventory=null;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>'₹ '+Number(v||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),num=v=>Number(v||0).toLocaleString('en-IN',{maximumFractionDigits:2});function add(html,user=false){let e=document.createElement('div');e.className='message'+(user?' user':'');e.innerHTML=user?`<div class="bubble"><p>${esc(html)}</p></div>`:`<div class="avatar">🤖</div><div class="bubble">${html}</div>`;messages.append(e);messages.scrollTop=messages.scrollHeight}function greet(){add('<p><strong>Hello! I can check your current item prices and stock.</strong></p><p class="help">Enter a product name, item code, barcode, or department. This chat is not saved: refreshing or reopening starts a new chat.</p><div class="chips"><button class="chip" type="button">LED bulb</button><button class="chip" type="button">wire</button><button class="chip" type="button">switch</button></div>');document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{query.value=b.textContent;form.requestSubmit()})}async function load(){if(inventory)return inventory;if(!window.sbcc)throw Error('connection');status.style.display='block';status.textContent='Loading current stock…';let all=[],from=0,more=true,fields='item_code,item_name,barcode,price1,price2,price3,landing,balance,gst_percent,hsn_code,department,minimum_qty,maximum_qty';while(more){let {data,error}=await sbcc.from('stock_balance_view').select(fields).order('item_code',{ascending:true}).range(from,from+999);if(error)throw error;all.push(...(data||[]));more=(data||[]).length===1000;from+=1000}let unique=new Map;all.forEach(i=>{let c=String(i.item_code||'').trim();if(c)unique.set(c,i)});inventory=[...unique.values()];status.style.display='none';return inventory}function matches(items,text){let words=text.toLowerCase().trim().split(/\s+/).filter(Boolean);return items.map(item=>{let hay=[item.item_name,item.item_code,item.barcode,item.department].join(' ').toLowerCase(),hits=words.filter(w=>hay.includes(w)).length;return{item,score:(hay.includes(text.toLowerCase())?100:0)+hits}}).filter(x=>x.score).sort((a,b)=>b.score-a.score||String(a.item.item_name).localeCompare(String(b.item.item_name))).slice(0,12).map(x=>x.item)}function card(i){let b=Number(i.balance||0),ok=b>0;return `<article class="item-card"><h3>${esc(i.item_name||i.item_code||'Unnamed item')}</h3><table><tbody><tr><th>Item code</th><td>${esc(i.item_code||'—')}</td></tr><tr><th>Price 1</th><td>${money(i.price1)}</td></tr><tr><th>Price 2</th><td>${money(i.price2)}</td></tr><tr><th>Price 3</th><td>${money(i.price3)}</td></tr><tr><th>Stock</th><td class="${ok?'stock-ok':'stock-out'}">${ok?num(b)+' available':'Out of stock'}</td></tr><tr><th>Barcode</th><td>${esc(i.barcode||'—')}</td></tr><tr><th>Department</th><td>${esc(i.department||'—')}</td></tr><tr><th>GST</th><td>${esc(i.gst_percent??'—')}%</td></tr></tbody></table></article>`}form.addEventListener('submit',async e=>{e.preventDefault();let text=query.value.trim();if(!text||send.disabled)return;add(text,true);query.value='';send.disabled=true;send.textContent='Checking…';try{let items=matches(await load(),text);add(items.length?`<p><strong>${items.length} matching item${items.length===1?'':'s'} found</strong> for “${esc(text)}”.</p><div class="results">${items.map(card).join('')}</div>`:`<p>I couldn’t find an item matching <strong>${esc(text)}</strong>.</p><p class="help">Try a shorter name, item code, barcode, or another keyword.</p>`)}catch(err){console.error(err);status.style.display='none';add('<p>Sorry, I could not load the current stock. Please check your connection and try again.</p>')}finally{send.disabled=false;send.textContent='Send';query.focus()}});greet();query.focus();
</script></body></html>
