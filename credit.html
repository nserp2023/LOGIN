<style>

<body>
<div class="wrap">
  <div class="top"><div><h1>Credit Accounts</h1><p>Credit bills, approved credit collections, advances, accepted returns, and customer refunds.</p></div><div><a class="btn alt home-btn" href="dashboard.html" title="Dashboard" aria-label="Dashboard">⌂</a><button class="btn alt" id="refreshBtn">Refresh</button><button class="btn" id="printBalancesBtn">Print Balances</button></div></div>
  <div class="panel filters">
    <div class="field"><label for="search">Customer mobile or name</label><input id="search" placeholder="Search exact customer account"></div>
    <div class="field"><label for="fromDate">From</label><input id="fromDate" type="date"></div>
    <div class="field"><label for="toDate">To</label><input id="toDate" type="date"></div>
    <div class="field"><label for="mode">View</label><select id="mode"><option value="nonzero">Non-zero accounts</option><option value="all">All credit accounts</option></select></div>
    <button class="btn" id="loadBtn">Load Accounts</button>
  </div>
  <div class="panel summary">
    <div class="stat"><small>Accounts</small><strong id="sAccounts" class="blue">0</strong></div><div class="stat"><small>Credit</small><strong id="sOwed" class="red">0.00</strong></div><div class="stat"><small>Advance</small><strong id="sHeld" class="green">0.00</strong></div><div class="stat"><small>Balance</small><strong id="sBalance" class="red">0.00</strong></div>

  </div>
  <div class="panel"><div class="status" id="status">Loading credit accounts...</div></div>
  <div class="panel table-wrap"><table><thead><tr><th>Customer</th><th>Mobile</th><th class="right">Bills</th><th class="right">Bill Amount</th><th class="right">Payment</th><th class="right">Credit Receipt</th><th class="right">Advance</th><th class="right">Return</th><th class="right">Balance as of To</th><th>Actions</th></tr></thead><tbody id="accounts"><tr><td colspan="10" class="empty">Loading...</td></tr></tbody></table></div>
</div>
<div id="printArea"></div>
<script>
const sb=window.sbcc, $=id=>document.getElementById(id), money=v=>(Number(v||0)||0).toFixed(2), clean=v=>String(v||'').trim(), digits=v=>clean(v).replace(/\D/g,'').slice(-10), nameKey=v=>clean(v).toLowerCase().replace(/\s+/g,' '), safe=v=>clean(v).replaceAll('%','').replaceAll('_','').replaceAll(',',' ');
let accounts=new Map(),activeFrom='',activeTo='',customerMobileAliases=new Map();
function keyFor(name,mobile){return `${digits(mobile)}|${nameKey(name)}`}
function findAccount(name,mobile){const m=digits(mobile),n=nameKey(name);if(m){for(const a of accounts.values())if(a.mobile===m)return a;return null}if(!n)return null;const matches=[...accounts.values()].filter(a=>nameKey(a.name)===n);return matches.length===1?matches[0]:null}
function account(name,mobile){const accountName=nameKey(name),mobileDigits=digits(mobile);if(accountName&&mobileDigits){if(!customerMobileAliases.has(accountName))customerMobileAliases.set(accountName,new Set());customerMobileAliases.get(accountName).add(mobileDigits)}let a=findAccount(name,mobile);if(a)return a;a={key:keyFor(name,mobile),name:clean(name)||'-',mobile:mobileDigits||'-',bills:0,billAmount:0,payments:0,receipts:0,advances:0,returns:0,entries:[]};accounts.set(a.key,a);return a}
function billAmount(row){const preserved=Number(row.credit_bill_amount);return String(row.salesman||'').trim().toUpperCase()==='VAJRA'&&Number.isFinite(preserved)&&preserved>=0?preserved:Number(row.invoice_amount||0)||0}
function classifyCash(row){const type=clean(row.txn_type).toLowerCase(),ref=clean(row.reference_type).toLowerCase().replace(/[-\s]+/g,'_'),text=clean(`${row.remarks||''} ${row.reference_type||''}`).toLowerCase().replace(/[-_]+/g,' ');const refund=type==='payment'&&(ref==='customer_credit_refund'||text.includes('refund of customer negative credit balance')||text.includes('customer credit refund')||text.includes('refund return amount'));const receipt=type==='receipt'&&(['sales_credit','sales_pack_credit','customer_credit_auto','customer_credit_refund'].includes(ref)||text.includes('credit collection')||text.includes('auto alloc'));const advance=type==='receipt'&&(['customer_advance','sales_order','sales_order_advance','sales_order_advance_receipt','sales_order_conversion_receipt'].includes(ref)||text.includes('sales order advance')||text.includes('advance received')||text.includes('advance paid')||text.includes('advance credit receipt'));return refund?'payment':receipt?'receipt':advance?'advance':''}
function addEntry(a,type,date,doc,amount,remark,metadata={}){const value=Number(amount||0)||0,entryDate=String(date||'').slice(0,10);a.entries.push({type,date:entryDate,doc:doc||'',amount:value,remark:remark||'',...metadata});if((!activeFrom||!entryDate||entryDate>=activeFrom)&&(!activeTo||!entryDate||entryDate<=activeTo)){if(type==='bill'){a.bills++;a.billAmount+=value}else if(type==='payment')a.payments+=value;else if(type==='receipt')a.receipts+=value;else if(type==='advance')a.advances+=value;else if(type==='return')a.returns+=value}}
async function load(){const from=$('fromDate').value,to=$('toDate').value,search=clean($('search').value),term=search.toLowerCase();activeFrom=from;activeTo=to;$('accounts').innerHTML='<tr><td colspan="10" class="empty">Loading...</td></tr>';try{accounts=await window.loadCanonicalCreditAccounts({from,to,search});render(term);$('status').textContent=`${[...accounts.values()].filter(a=>visible(a,term)).length} credit account(s) loaded. Balances use customer mobile where available.`;return}catch(e){console.error(e);$('accounts').innerHTML='<tr><td colspan="10" class="empty">Unable to load credit accounts.</td></tr>';$('status').textContent='Error: '+(e.message||'Unable to load');return}accounts=new Map();customerMobileAliases=new Map();try{
 let q=sb.from('sales_details').select('id,bill_date,series_code,sales_number,customer_name,customer_mobile,invoice_amount,credit_bill_amount,payment_type,salesman').in('payment_type',['CREDIT','ADVANCE CREDIT']).order('bill_date',{ascending:true}).order('id',{ascending:true});if(to)q=q.lte('bill_date',to);const saleRows=[];for(let page=0;;page++){const sales=await q.range(page*1000,page*1000+999);if(sales.error)throw sales.error;saleRows.push(...(sales.data||[]));if((sales.data||[]).length<1000)break}
 const saleIds=saleRows.map(r=>r.id).filter(Boolean),packMap=new Map();for(let offset=0;offset<saleIds.length;offset+=500){const packQuery=await sb.from('sales_packing_details').select('id,sales_id,packing_amount,packing_number,series_code').in('sales_id',saleIds.slice(offset,offset+500));if(!packQuery.error)(packQuery.data||[]).forEach(p=>packMap.set(String(p.sales_id),p));}saleRows.forEach(r=>{const a=account(r.customer_name,r.customer_mobile),pack=packMap.get(String(r.id)),v=pack&&Number(pack.packing_amount)>0?Number(pack.packing_amount):billAmount(r);addEntry(a,'bill',r.bill_date,pack?`${pack.series_code||r.series_code||''}-${pack.packing_number||r.sales_number||''}`:`${r.series_code||''}-${r.sales_number||''}`,v,pack?'Sales + Packing credit bill':'Credit bill',{salesId:r.id,packingId:pack?.id||null})});
 const searchedCustomers=[];if(search){let customerQuery=sb.from('customers').select('name,mobile');const searchDigits=digits(search);if(searchDigits.length>=3)customerQuery=customerQuery.ilike('mobile',`%${searchDigits}%`);else customerQuery=customerQuery.ilike('name',`%${safe(search)}%`);const customerRows=await customerQuery.limit(50);if(!customerRows.error){searchedCustomers.push(...(customerRows.data||[]));searchedCustomers.forEach(r=>{const a=account(r.name,r.mobile);if(clean(r.name))a.name=clean(r.name)});}}
 const searchedCustomerMobiles=new Set(searchedCustomers.map(r=>digits(r.mobile)).filter(Boolean)),searchedCustomerNames=new Set(searchedCustomers.map(r=>nameKey(r.name)).filter(Boolean));
 const cashRows=[];for(let page=0;;page++){const cashPage=await sb.from('cash_transactions').select('txn_date,voucher_no,txn_type,party_name,amount,remarks,reference_type,approval_status').range(page*1000,page*1000+999);if(cashPage.error)throw cashPage.error;cashRows.push(...(cashPage.data||[]));if((cashPage.data||[]).length<1000)break;}const cash={data:cashRows};
 (cash.data||[]).forEach(r=>{const transactionDate=String(r.txn_date||'').slice(0,10);if(to&&transactionDate&&transactionDate>to)return;const transactionType=clean(r.txn_type).toLowerCase();if(transactionType!=='receipt'&&transactionType!=='payment')return;const approval=clean(r.approval_status).toLowerCase();if(approval!=='approved')return;const party=clean(r.party_name),m=digits(party),knownMobiles=customerMobileAliases.get(nameKey(party)),aliasMobile=!m&&knownMobiles&&knownMobiles.size===1?[...knownMobiles][0]:'',accountMobile=m||aliasMobile,accountName=/^[0-9+\-\s]+$/.test(party);let type=classifyCash(r);const isSearchedCustomerPayment=transactionType==='payment'&&((accountMobile&&searchedCustomerMobiles.has(accountMobile))||searchedCustomerNames.has(nameKey(party)));if(!type&&isSearchedCustomerPayment)type='payment';if(!type)return;const matched=accountMobile?Array.from(accounts.values()).find(a=>a.mobile===accountMobile):findAccount(party,'');if(accountMobile&&!matched)return;const a=matched||account(accountName?'':party,'');const v=Number(r.amount||0)||0;addEntry(a,type,r.txn_date,r.voucher_no,v,r.remarks)});
 let rq=sb.from('sales_return_details').select('id,return_date,customer_name,customer_mobile,approval_status,is_accepted,return_payment_type,settlement_mode,credit_adjustment_amount,total_return_amount').order('return_date',{ascending:true}).order('id',{ascending:true});if(to)rq=rq.lte('return_date',to);const returnRows=[];for(let page=0;;page++){const returns=await rq.range(page*1000,page*1000+999);if(returns.error)throw returns.error;returnRows.push(...(returns.data||[]));if((returns.data||[]).length<1000)break}(returnRows).forEach(r=>{const status=clean(r.approval_status).toLowerCase();const accepted=r.is_accepted===true||status==='approved';const rt=`${r.return_payment_type||r.settlement_mode||''}`.toUpperCase();if(!accepted||!rt.includes('CREDIT'))return;const a=account(r.customer_name,r.customer_mobile),v=Number(r.credit_adjustment_amount||r.total_return_amount||0)||0;addEntry(a,'return',r.return_date,`SR-${r.id}`,v,'Accepted credit return')});
 render(term);$('status').textContent=`${[...accounts.values()].filter(a=>visible(a,term)).length} credit account(s) loaded. Normal-purpose transactions excluded.`;
 }catch(e){console.error(e);$('accounts').innerHTML='<tr><td colspan="10" class="empty">Unable to load credit accounts.</td></tr>';$('status').textContent='Error: '+(e.message||'Unable to load')}
}
function balance(a){return a.entries.reduce((total,e)=>total+(e.type==='bill'||e.type==='payment'?e.amount:-e.amount),0)}
function visible(a,term){const searchDigits=digits(term);const matches=!term||a.name.includes(term)||(searchDigits.length>=3&&a.mobile.includes(searchDigits))||a.mobile.includes(term);return digits(a.mobile).length===10&&matches&&($('mode').value==='all'||Math.abs(balance(a))>=0.005)}
function render(term){let rows=[...accounts.values()].filter(a=>visible(a,term)).sort((a,b)=>balance(b)-balance(a));let totals={bills:0,billAmount:0,payments:0,receipts:0,deductions:0,balance:0};const html=rows.map((a,i)=>{const b=balance(a);totals.bills+=a.bills;totals.billAmount+=a.billAmount;totals.payments+=a.payments;totals.receipts+=a.receipts;totals.deductions+=a.advances+a.returns;totals.balance+=b;const detail=a.entries.sort((x,y)=>new Date(x.date)-new Date(y.date)).map(e=>`<tr><td>${e.date}</td><td><span class="chip chip-${e.type}">${e.type.toUpperCase()}</span></td><td>${e.doc}</td><td class="right">${e.type==='payment'?'+':''}${e.type==='receipt'||e.type==='advance'||e.type==='return'?'-':''}${money(e.amount)}</td><td>${e.remark}</td></tr>`).join('');return `<tr class="account-row" data-index="${i}"><td>${a.name}</td><td>${a.mobile}</td><td class="right">${a.bills}</td><td class="right">${money(a.billAmount)}</td><td class="right">${money(a.payments)}</td><td class="right">${money(a.receipts)}</td><td class="right">${money(a.advances)}</td><td class="right">${money(a.returns)}</td><td class="right"><strong class="${b<0?'red':b>0?'green':'blue'}">${money(b)}</strong></td></tr><tr class="detail-row" data-detail="${i}" hidden><td colspan="9"><div class="detail"><table><thead><tr><th>Date</th><th>Type</th><th>Voucher</th><th class="right">Amount</th><th>Remarks</th></tr></thead><tbody>${detail||'<tr><td colspan="5" class="empty">No entries</td></tr>'}</tbody></table></div></td></tr>`}).join('');$('accounts').innerHTML=html||'<tr><td colspan="9" class="empty">No matching credit account</td></tr>';$('sAccounts').textContent=rows.length;$('sBills').textContent=totals.bills;$('sBillAmount').textContent=money(totals.billAmount);$('sPayments').textContent=money(totals.payments);$('sReceipts').textContent=money(totals.receipts);$('sDeductions').textContent=money(totals.deductions);$('sBalance').textContent=money(totals.balance);document.querySelectorAll('.account-row').forEach(row=>row.onclick=()=>{const d=document.querySelector(`[data-detail="${row.dataset.index}"]`);d.hidden=!d.hidden})}
document.addEventListener('DOMContentLoaded',async()=>{try{if(window.requirePageAccess&&!await requirePageAccess('sales'))return}catch(e){};const today=new Date().toISOString().slice(0,10);$('fromDate').value='2000-01-01';$('toDate').value=today;$('loadBtn').onclick=load;$('refreshBtn').onclick=load;$('mode').onchange=()=>render(clean($('search').value).toLowerCase());$('search').onkeydown=e=>{if(e.key==='Enter')load()};await load()});
let renderedAccounts=[];
const htmlEscape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const entryChange=entry=>entry.type==='bill'||entry.type==='payment'?entry.amount:-entry.amount;
function dateLabel(){return `${activeFrom||'Beginning'} to ${activeTo||'Latest'}`}
function printContent(content){$('printArea').innerHTML=content;window.print()}
function printBalances(){const rows=renderedAccounts.filter(a=>Math.abs(balance(a))>=0.005);const body=rows.map(a=>`<tr><td>${htmlEscape(a.name)}</td><td>${htmlEscape(a.mobile)}</td><td class="right">${money(balance(a))}</td></tr>`).join('');printContent(`<h1>Customer Credit Balances</h1><p>Balance as of ${htmlEscape(activeTo||'latest available')} | ${rows.length} customer(s)</p><table><thead><tr><th>Customer</th><th>Mobile</th><th class="right">Balance</th></tr></thead><tbody>${body||'<tr><td colspan="3">No customers with balances</td></tr>'}</tbody></table>`)}
function printCustomerDetail(index){const account=renderedAccounts[index];if(!account)return;const from=activeFrom,to=activeTo,entries=[...account.entries].sort((a,b)=>a.date.localeCompare(b.date));let opening=0;entries.forEach(entry=>{if(from&&entry.date&&entry.date<from)opening+=entryChange(entry)});const period=entries.filter(entry=>(!from||!entry.date||entry.date>=from)&&(!to||!entry.date||entry.date<=to));let running=opening;const rows=[`<tr class="total"><td>${htmlEscape(from||'')}</td><td>Opening Balance</td><td></td><td class="right">-</td><td class="right">-</td><td class="right">${money(running)}</td></tr>`];period.forEach(entry=>{running+=entryChange(entry);const reduction=entry.type==='receipt'||entry.type==='advance'||entry.type==='return';rows.push(`<tr><td>${htmlEscape(entry.date)}</td><td>${htmlEscape(entry.type.toUpperCase())}${entry.remark?` - ${htmlEscape(entry.remark)}`:''}</td><td>${htmlEscape(entry.doc)}</td><td class="right">${reduction?money(entry.amount):'-'}</td><td class="right">${reduction?'-':money(entry.amount)}</td><td class="right">${money(running)}</td></tr>`)});rows.push(`<tr class="total"><td colspan="5">Closing Balance</td><td class="right">${money(running)}</td></tr>`);printContent(`<h1>Customer Credit Statement</h1><p><strong>${htmlEscape(account.name)}</strong> | Mobile: ${htmlEscape(account.mobile)}</p><p>Period: ${htmlEscape(dateLabel())}</p><table><thead><tr><th>Date</th><th>Particulars</th><th>Voucher</th><th class="right">Credit / Reduction</th><th class="right">Debit / Increase</th><th class="right">Balance</th></tr></thead><tbody>${rows.join('')}</tbody></table>`)}
render=function(term){
 renderedAccounts=[...accounts.values()].filter(a=>visible(a,term)).sort((a,b)=>balance(b)-balance(a));
 const totals={bills:0,billAmount:0,payments:0,receipts:0,deductions:0,balance:0};
 const html=renderedAccounts.map((a,index)=>{const currentBalance=balance(a);totals.bills+=a.bills;totals.billAmount+=a.billAmount;totals.payments+=a.payments;totals.receipts+=a.receipts;totals.deductions+=a.advances+a.returns;totals.balance+=currentBalance;const entries=[...a.entries].sort((x,y)=>x.date.localeCompare(y.date));let opening=0;entries.forEach(entry=>{if(activeFrom&&entry.date&&entry.date<activeFrom)opening+=entryChange(entry)});let running=opening;const detailRows=[`<tr><td>${htmlEscape(activeFrom||'')}</td><td>Opening Balance</td><td></td><td class="right">-</td><td class="right">-</td><td class="right">${money(running)}</td></tr>`];entries.filter(entry=>(!activeFrom||!entry.date||entry.date>=activeFrom)&&(!activeTo||!entry.date||entry.date<=activeTo)).forEach(entry=>{running+=entryChange(entry);const reduction=entry.type==='receipt'||entry.type==='advance'||entry.type==='return';detailRows.push(`<tr><td>${htmlEscape(entry.date)}</td><td>${htmlEscape(entry.type.toUpperCase())}</td><td>${htmlEscape(entry.doc)}</td><td class="right">${reduction?money(entry.amount):'-'}</td><td class="right">${reduction?'-':money(entry.amount)}</td><td class="right">${money(running)}</td></tr>`)});return `<tr class="account-row" data-index="${index}"><td>${htmlEscape(a.name)}</td><td>${htmlEscape(a.mobile)}</td><td class="right">${a.bills}</td><td class="right">${money(a.billAmount)}</td><td class="right">${money(a.payments)}</td><td class="right">${money(a.receipts)}</td><td class="right">${money(a.advances)}</td><td class="right">${money(a.returns)}</td><td class="right"><strong class="${currentBalance<0?'red':currentBalance>0?'green':'blue'}">${money(currentBalance)}</strong></td><td><button class="btn alt print-detail" data-print-index="${index}" title="Print customer detail">Print detail</button></td></tr><tr class="detail-row" data-detail="${index}" hidden><td colspan="10"><div class="detail"><table><thead><tr><th>Date</th><th>Type</th><th>Voucher</th><th class="right">Credit / Reduction</th><th class="right">Debit / Increase</th><th class="right">Balance</th></tr></thead><tbody>${detailRows.join('')}</tbody></table></div></td></tr>`}).join('');
 $('accounts').innerHTML=html||'<tr><td colspan="10" class="empty">No matching credit account</td></tr>';$('sAccounts').textContent=renderedAccounts.length;$('sBalance').textContent=money(totals.balance);
};
const creditReminderKey=customer=>`credit-whatsapp-reminder:${digits(customer.mobile)}`;
function isCreditReminderEnabled(customer){return localStorage.getItem(creditReminderKey(customer))!=='false'}
let canManageCreditReminders=false;
async function initializeCreditReminderAccess(){try{const profile=await getLoggedInProfile();canManageCreditReminders=['OWNER','ADMIN'].includes(String(profile?.role||'').trim().toUpperCase())}catch(error){console.warn('Credit reminder permission check failed',error);canManageCreditReminders=false}render(clean($('search').value).toLowerCase())}
function sendWhatsAppReminder(index){const customer=renderedAccounts[index];if(!customer||!isCreditReminderEnabled(customer))return;const mobile=digits(customer.mobile),pending=balance(customer);if(mobile.length!==10){alert('A valid 10-digit customer mobile number is required for WhatsApp.');return}if(pending<=0){alert('This customer has no pending balance to pay.');return}const message=`നമസ്കാരം ${customer.name},\n\nതാങ്കളുടെ നിലവിലെ BALANCE തുക ₹${money(pending)} ആണ്. ദയവായി ഈ തുക അടച്ച് തീർപ്പാക്കണമെന്ന് അഭ്യർത്ഥിക്കുന്നു.\n\nനന്ദി,\nVAJRA LIGHTS`;window.open(`https://wa.me/91${mobile}?text=${encodeURIComponent(message)}`,'_blank','noopener,noreferrer')}
function printCreditBill(button){if(!canManageCreditReminders)return;const saleId=button.dataset.salesId,packingId=button.dataset.packingId;if(packingId){window.open(`print.html?id=${encodeURIComponent(packingId)}&type=sales_pack&copy=packing`,'_blank','noopener,noreferrer');return}if(saleId){window.open(`print.html?id=${encodeURIComponent(saleId)}&type=sales&copy=invoice`,'_blank','noopener,noreferrer')}}
const renderCreditAccounts=render;
render=function(term){
 renderCreditAccounts(term);
 if(canManageCreditReminders){
  renderedAccounts.forEach((customer,accountIndex)=>{
   const detailRow=document.querySelector(`[data-detail="${accountIndex}"]`);if(!detailRow)return;
   const detailRows=detailRow.querySelectorAll('tbody tr');
  const billRows=[...detailRows].filter(row=>String(row.cells[1]?.textContent||'').trim().toUpperCase()==='BILL');
   const entries=[...customer.entries].sort((a,b)=>a.date.localeCompare(b.date)).filter(entry=>(!activeFrom||!entry.date||entry.date>=activeFrom)&&(!activeTo||!entry.date||entry.date<=activeTo));
  let billIndex=0;
  entries.forEach(entry=>{
    if(entry.type!=='bill')return;
   const voucherCell=billRows[billIndex++]?.cells[2];if(!voucherCell||voucherCell.querySelector('.credit-bill-print'))return;
   const button=document.createElement('button');button.type='button';button.className='credit-bill-print';button.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7zM18 11h.01"/></svg>';button.title=entry.packingId?'Print packing slip':'Print GST invoice';button.setAttribute('aria-label',button.title);
    button.dataset.salesId=entry.salesId||'';button.dataset.packingId=entry.packingId||'';button.addEventListener('click',event=>{event.stopPropagation();printCreditBill(button)});voucherCell.append(' ',button);
   });
  });
 }
 const creditTotals=renderedAccounts.reduce((totals,customer)=>{const customerBalance=balance(customer);totals.owed+=Math.max(customerBalance,0);totals.held+=Math.max(-customerBalance,0);return totals},{owed:0,held:0});
 $('sOwed').textContent=money(creditTotals.owed);$('sHeld').textContent=money(creditTotals.held);
 document.querySelectorAll('.account-row').forEach(row=>{
  const printButton=row.querySelector('.print-detail');if(!printButton)return;
  printButton.classList.add('detail-action');printButton.setAttribute('aria-label','Print customer detail');printButton.title='Print customer detail';printButton.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8V3h10v5M7 17H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7zM18 11h.01"/></svg>';
  const actions=document.createElement('div');actions.className='detail-actions';printButton.parentNode.replaceChild(actions,printButton);actions.appendChild(printButton);
  const customer=renderedAccounts[Number(row.dataset.index)],hasBalance=!!customer&&balance(customer)>0;
  if(canManageCreditReminders){
   const label=document.createElement('label');label.className='credit-reminder-toggle';label.title='Allow WhatsApp balance reminders for this customer';
    const checkbox=document.createElement('input');checkbox.type='checkbox';checkbox.className='credit-reminder-checkbox';checkbox.dataset.reminderIndex=row.dataset.index;checkbox.checked=isCreditReminderEnabled(customer);checkbox.setAttribute('aria-label',`Allow WhatsApp reminders for ${customer.name}`);label.appendChild(checkbox);
    row.cells[0].prepend(label);
  }
  const whatsappButton=document.createElement('button');whatsappButton.type='button';whatsappButton.className='detail-action whatsapp-detail';whatsappButton.dataset.whatsappIndex=row.dataset.index;whatsappButton.textContent='WhatsApp';whatsappButton.title='Open Malayalam balance reminder in WhatsApp';whatsappButton.setAttribute('aria-label','Open Malayalam balance reminder in WhatsApp');whatsappButton.disabled=!customer||digits(customer.mobile).length!==10||!hasBalance||!isCreditReminderEnabled(customer);actions.appendChild(whatsappButton);
 });
};
document.addEventListener('DOMContentLoaded',()=>{
 $('printBalancesBtn').onclick=printBalances;
 initializeCreditReminderAccess();
 $('accounts').addEventListener('change',event=>{
  const checkbox=event.target.closest('.credit-reminder-checkbox');if(!checkbox)return;
  const customer=renderedAccounts[Number(checkbox.dataset.reminderIndex)];if(!customer)return;
  if(!canManageCreditReminders){checkbox.checked=isCreditReminderEnabled(customer);return}
  localStorage.setItem(creditReminderKey(customer),String(checkbox.checked));
  const whatsappButton=checkbox.closest('.account-row').querySelector('.whatsapp-detail');
  if(whatsappButton)whatsappButton.disabled=!checkbox.checked||digits(customer.mobile).length!==10||balance(customer)<=0;
 });
 $('accounts').addEventListener('click',event=>{
  if(event.target.closest('.credit-reminder-toggle')){event.stopPropagation();return}
  const whatsappButton=event.target.closest('.whatsapp-detail');if(whatsappButton){event.stopPropagation();if(!whatsappButton.disabled)sendWhatsAppReminder(Number(whatsappButton.dataset.whatsappIndex));return}
  const button=event.target.closest('.print-detail');if(button){event.stopPropagation();printCustomerDetail(Number(button.dataset.printIndex));return}
  const row=event.target.closest('.account-row');if(row){const detail=document.querySelector(`[data-detail="${row.dataset.index}"]`);if(detail)detail.hidden=!detail.hidden}
 });
});
</script>
