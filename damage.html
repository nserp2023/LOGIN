<style>
:root{--blue:#2563eb;--ink:#17213a;--muted:#64748b;--line:#dbe3ef;--bg:#eef4fb;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f8fbff,var(--bg));color:var(--ink);font:14px "Segoe UI",Arial,sans-serif}.wrap{max-width:1450px;margin:auto;padding:18px}.top,.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{margin:0}.sub{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px #1e3a5f14;padding:16px;margin-top:14px}.fields{display:grid;grid-template-columns:150px 1fr 1fr 2fr;gap:12px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:5px}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;outline:none}input:focus,textarea:focus{border-color:#6ea1ff;box-shadow:0 0 0 3px #2563eb1a}.tablebox{overflow:visible;margin-top:12px}.grid{display:grid;grid-template-columns:45px 150px minmax(280px,1fr) 110px 1fr 52px;gap:8px;align-items:center}.hdr{color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;padding:0 8px 7px}.row{position:relative;padding:8px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:#fbfdff}.num{text-align:center;font-weight:800}.qty{text-align:right}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(#3b82f6,#2563eb);color:#fff}.green{background:linear-gradient(#22c55e,#16a34a);color:#fff}.soft{background:#eaf1ff;color:#1d4ed8}.danger{background:#fee2e2;color:#991b1b;padding:9px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.status{margin-top:12px;padding:10px;border-radius:10px;background:#eff6ff;color:#1e40af;font-weight:700}.status.err{background:#fee2e2;color:#991b1b}.suggest{position:absolute;z-index:50;left:203px;right:178px;top:51px;max-height:260px;overflow:auto;background:white;border:1px solid #9db8e4;border-radius:10px;box-shadow:0 15px 35px #0f172a30}.opt{padding:9px 11px;border-bottom:1px solid #edf2f7;cursor:pointer}.opt:hover{background:#eff6ff}.opt small{display:block;color:var(--muted);margin-top:2px}@media(max-width:800px){.fields{grid-template-columns:1fr}.grid{grid-template-columns:35px 100px minmax(210px,1fr) 80px 150px 42px;min-width:700px}.tablebox{overflow:auto}.suggest{left:151px;right:140px}.actions .btn{flex:1}}
.row:focus-within{border-color:#93b4ec;background:#f8fbff}.suggest{max-height:280px}.suggest table{width:100%;border-collapse:collapse}.suggest th{position:sticky;top:0;background:#eaf1ff;color:#475569;text-align:left;padding:7px 10px;font-size:11px;text-transform:uppercase}.suggest td{padding:9px 10px;border-top:1px solid #edf2f7}.suggest .opt{cursor:pointer}.suggest .opt:hover td,.suggest .opt.selected td{background:#dbeafe;color:#1e3a8a}.suggest .empty{padding:10px;color:var(--muted)}
.field{position:relative}.supplier-suggestions{position:absolute;z-index:80;top:100%;left:0;right:0;max-height:280px;overflow:auto;background:#fff;border:1px solid #9db8e4;border-radius:8px;box-shadow:0 12px 28px #0f172a24}.supplier-option{padding:9px 11px;border-bottom:1px solid #edf2f7;cursor:pointer}.supplier-option:last-child{border-bottom:0}.supplier-option.selected,.supplier-option:hover{background:#dbeafe}.supplier-option b,.supplier-option small{display:block}.supplier-option small{margin-top:2px;color:var(--muted)}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Damage Entry</h1><div class="sub">Record damaged products only — stock will not be adjusted.</div></div><div class="actions"><button class="btn soft" onclick="location.href='purchase_report.html'">Purchase Report</button><button class="btn soft" onclick="location.href='damage_report.html'">Damage Report</button></div></div>
<section class="card"><div class="fields"><div class="field"><label>Damage Date</label><input id="damageDate" type="date"></div><div class="field"><label>Supplier / Company</label><input id="supplier" placeholder="Optional"></div><div class="field"><label>Invoice / Reference</label><input id="reference" placeholder="Optional"></div><div class="field"><label>Common Remark</label><input id="commonRemark" placeholder="Optional note for this entry"></div></div></section>
<section class="card"><div class="head"><div><b>Damaged Items</b><div class="sub">Search by code or item name. Add the same item again if needed.</div></div><div class="actions"><button class="btn soft" id="toggleLanding" type="button" title="Show landing costs" aria-label="Show landing costs" aria-pressed="false" style="width:42px;height:42px;padding:0;display:grid;place-items:center"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button><button class="btn soft" id="addBtn">+ Add Row</button></div></div><div class="tablebox"><div class="grid hdr"><div>#</div><div>Item Code</div><div>Item Name / Search</div><div>Damage Qty</div><div>Reason / Item Remark</div><div id="landingHeader" hidden>Landing / Total</div><div></div></div><div id="rows"></div></div><div class="actions"><button class="btn green" id="printSaveBtn" type="button" title="Save and print" aria-label="Save and print" style="width:46px;height:44px;padding:0;display:grid;place-items:center"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg></button><button class="btn" id="whatsappSaveBtn" type="button" title="Save and share on WhatsApp" aria-label="Save and share on WhatsApp" style="width:46px;height:44px;padding:0;display:grid;place-items:center;background:#16a34a;color:#fff"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.5 8.5 0 0 1-12.6 7.4L3 21l2.1-5.2A8.5 8.5 0 1 1 21 11.5Z"/><path d="M8.5 8.2c.6 3 2.3 4.7 5.3 5.3"/></svg></button></div><div class="status" id="landingSummary" hidden></div><div class="status" id="status">Loading item list...</div></section>
</div><script>
const sb=window.sbcc;let stock=[],seq=0,supplierSearchId=0,supplierActiveIndex=-1,supplierMatches=[];const rows=document.getElementById('rows'),statusEl=document.getElementById('status'),supplierSuggestions=document.createElement('div');supplierSuggestions.className='supplier-suggestions';supplierSuggestions.hidden=true;supplier.parentElement.appendChild(supplierSuggestions);supplier.autocomplete='off';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.addEventListener('DOMContentLoaded',async()=>{installDamagePrintStyles();if(!await requirePageAccess('purchase'))return;damageDate.value=new Date().toISOString().slice(0,10);addRow();addRow();await loadStock()});
supplier.addEventListener('input',searchDamageSuppliers);supplier.addEventListener('keydown',handleSupplierKeydown);supplier.addEventListener('blur',()=>setTimeout(hideSupplierSuggestions,150));
async function searchDamageSuppliers(){const requestId=++supplierSearchId,query=supplier.value.trim();supplier.dataset.supplierId='';supplierActiveIndex=-1;if(query.length<2){hideSupplierSuggestions();return}supplierSuggestions.hidden=false;supplierSuggestions.innerHTML='<div class="supplier-option">Searching suppliers...</div>';const {data,error}=await sb.from('suppliers').select('supplier_id,name,gst_number,state_code,address').ilike('name',`%${query}%`).limit(10);if(requestId!==supplierSearchId)return;if(error){supplierSuggestions.innerHTML='<div class="supplier-option">Unable to search suppliers.</div>';return}supplierMatches=data||[];supplierSuggestions.innerHTML=supplierMatches.length?supplierMatches.map((item,index)=>`<div class="supplier-option${index===0?' selected':''}" data-index="${index}"><b>${esc(item.name||'')}</b><small>${esc(item.gst_number||'')}${item.address?' · '+esc(item.address):''}</small></div>`).join(''):'<div class="supplier-option">No matching supplier</div>';supplierActiveIndex=supplierMatches.length?0:-1;supplierSuggestions.querySelectorAll('[data-index]').forEach(option=>option.addEventListener('mousedown',event=>{event.preventDefault();chooseDamageSupplier(Number(option.dataset.index))}))}
function chooseDamageSupplier(index){const selected=supplierMatches[index];if(!selected)return;supplier.value=selected.name||'';supplier.dataset.supplierId=selected.supplier_id||'';hideSupplierSuggestions()}
function hideSupplierSuggestions(){supplierSearchId++;supplierSuggestions.hidden=true;supplierSuggestions.innerHTML='';supplierActiveIndex=-1}
function handleSupplierKeydown(event){const options=[...supplierSuggestions.querySelectorAll('[data-index]')];if(supplierSuggestions.hidden||!options.length){if(event.key==='Escape')hideSupplierSuggestions();return}if(event.key==='ArrowDown'||event.key==='ArrowUp'){event.preventDefault();supplierActiveIndex=(supplierActiveIndex+(event.key==='ArrowDown'?1:-1)+options.length)%options.length;options.forEach((option,index)=>option.classList.toggle('selected',index===supplierActiveIndex));options[supplierActiveIndex].scrollIntoView({block:'nearest'})}else if(event.key==='Enter'){event.preventDefault();chooseDamageSupplier(supplierActiveIndex)}else if(event.key==='Escape'){event.preventDefault();hideSupplierSuggestions()}}
async function loadStock(){stock=[];for(let from=0;;from+=1000){const {data,error}=await sb.from('stock_balance_view').select('item_code,item_name,barcode,landing,balance,department,minimum_qty,maximum_qty').order('item_code').range(from,from+999);if(error){setStatus(error.message,true);return}stock.push(...(data||[]));if(!data||data.length<1000)break}const unique=new Map;stock.forEach(x=>{const code=String(x.item_code||'').trim();if(code)unique.set(code,x)});stock=[...unique.values()];updateLandingDisplay();setStatus(`${stock.length} items ready. Damage entries do not change stock.`)}
function renumber(){[...rows.children].forEach((r,i)=>r.querySelector('.num').textContent=i+1)}
// Match the item picker and Excel-like keyboard movement used in newsoq.html.
function createDamageRow(){const id=++seq,el=document.createElement('div');el.className='grid row';el.dataset.id=id;el.innerHTML=`<div class="num"></div><input class="code nav" data-col="0" autocomplete="off"><div style="position:relative"><input class="name nav" data-col="1" autocomplete="off" placeholder="Type item name or code"></div><input class="qty nav" data-col="2" type="number" min="0.001" step="0.001" value="1"><input class="reason nav" data-col="3" placeholder="Damage reason / remark"><div class="landing-cell" hidden></div><button class="btn danger" title="Remove">&times;</button>`;rows.appendChild(el);if(document.body.classList.contains('show-landing')){el.style.gridTemplateColumns='45px 130px minmax(220px,1fr) 90px minmax(150px,1fr) 140px 52px';el.querySelector('.landing-cell').hidden=false}el.querySelector('.danger').onclick=()=>{el.remove();renumber();updateLandingDisplay()};['.name','.code'].forEach(s=>{const input=el.querySelector(s);input.addEventListener('input',()=>{renderDamageSuggestions(el,s);updateLandingDisplay()});input.addEventListener('blur',()=>setTimeout(()=>el.querySelector('.suggest')?.remove(),180))});el.querySelector('.qty').addEventListener('input',updateLandingDisplay);renumber();return el}
const addRow=createDamageRow;
function normalizeDamageSearchText(value){return String(value||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()}
function matchingDamageItems(input){const normalizedQuery=normalizeDamageSearchText(input.value);if(!normalizedQuery)return[];const terms=normalizedQuery.split(' ').filter(Boolean),field=input.classList.contains('code')?'item_code':'item_name';const scored=stock.map(item=>{const code=normalizeDamageSearchText(item.item_code),name=normalizeDamageSearchText(item.item_name),barcode=normalizeDamageSearchText(item.barcode),primary=field==='item_code'?code:name,secondary=field==='item_code'?name:code;const matched=terms.every(term=>primary.includes(term))||terms.every(term=>secondary.includes(term))||terms.every(term=>(code+' '+name+' '+barcode).includes(term));if(!matched)return null;let score=0;if(primary===normalizedQuery)score+=1000;if(secondary===normalizedQuery)score+=900;if(barcode===normalizedQuery)score+=850;if(primary.startsWith(normalizedQuery))score+=700;if(secondary.startsWith(normalizedQuery))score+=650;if(barcode.startsWith(normalizedQuery))score+=600;if(code.startsWith(normalizedQuery))score+=600;if(name.startsWith(normalizedQuery))score+=550;for(const term of terms){if(code.includes(term))score+=40;if(name.includes(term))score+=40;if(barcode.includes(term))score+=35}score-=Math.abs(name.length-normalizedQuery.length)*.1;return{item,score}}).filter(Boolean);scored.sort((a,b)=>b.score-a.score||String(a.item.item_name||'').localeCompare(String(b.item.item_name||'')));return scored.slice(0,40).map(result=>result.item)}
function chooseDamageItem(row,item){if(!item)return;row.querySelector('.code').value=item.item_code||'';row.querySelector('.name').value=item.item_name||'';row.querySelector('.suggest')?.remove();updateLandingDisplay();const qty=row.querySelector('.qty');qty.focus();qty.select()}
function landingForCode(code){const key=normalizeDamageSearchText(code);const item=stock.find(x=>normalizeDamageSearchText(x.item_code)===key);return Number(item?.landing)||0}
function formatDamageMoney(value){return Number(value||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})}
function formatDamageQuantity(value){return Number(value||0).toLocaleString('en-IN',{maximumFractionDigits:3})}
function updateLandingDisplay(){let total=0;[...rows.children].forEach(row=>{const unit=landingForCode(row.querySelector('.code').value),quantity=Number(row.querySelector('.qty').value)||0,line=unit*quantity;total+=line;const cell=row.querySelector('.landing-cell');if(cell)cell.innerHTML=`<small>₹${formatDamageMoney(unit)} × ${formatDamageQuantity(quantity)}</small><b>₹${formatDamageMoney(line)}</b>`});if(!landingSummary.hidden)landingSummary.textContent=`Total landing cost: ₹${formatDamageMoney(total)}`}
function setLandingVisibility(show){document.body.classList.toggle('show-landing',show);toggleLanding.setAttribute('aria-pressed',String(show));toggleLanding.title=show?'Hide landing costs':'Show landing costs';toggleLanding.setAttribute('aria-label',toggleLanding.title);toggleLanding.innerHTML=show?'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.1 3.8M6.2 6.2C3.5 8 2 12 2 12s3.6 7 10 7c1 0 2-.2 2.8-.5"/></svg>':'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';const template=show?'45px 130px minmax(220px,1fr) 90px minmax(150px,1fr) 140px 52px':'45px 150px minmax(280px,1fr) 110px 1fr 52px';document.querySelector('.hdr').style.gridTemplateColumns=template;landingHeader.hidden=!show;[...rows.children].forEach(row=>{row.style.gridTemplateColumns=template;row.querySelector('.landing-cell').hidden=!show});landingSummary.hidden=!show;updateLandingDisplay()}
function renderDamageSuggestions(row,selector){row.querySelector('.suggest')?.remove();const input=row.querySelector(selector),found=matchingDamageItems(input);if(!input.value.trim())return;const box=document.createElement('div');box.className='suggest';box.innerHTML=found.length?`<table style="width:max-content;min-width:560px"><thead><tr><th>Item</th><th>Code</th><th>Dept</th><th>Stock</th><th>Min</th><th>Max</th></tr></thead><tbody>${found.map((x,i)=>`<tr class="opt${i===0?' selected':''}" data-i="${i}"><td>${esc(x.item_name)}</td><td>${esc(x.item_code)}</td><td>${esc(x.department||'ALL')}</td><td>${esc(x.balance||0)}</td><td>${esc(x.minimum_qty||0)}</td><td>${esc(x.maximum_qty||0)}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No matching item</div>';row.appendChild(box);box.querySelectorAll('.opt').forEach(o=>o.onmousedown=e=>{e.preventDefault();chooseDamageItem(row,found[+o.dataset.i])})}
function moveDamageSelection(box,step){const opts=[...box.querySelectorAll('.opt')];if(!opts.length)return;let i=opts.findIndex(o=>o.classList.contains('selected'));i=Math.max(0,Math.min(opts.length-1,i+step));opts.forEach((o,n)=>o.classList.toggle('selected',n===i));opts[i].scrollIntoView({block:'nearest'})}
rows.addEventListener('keydown',e=>{const input=e.target.closest('.nav');if(!input)return;const row=input.closest('.row'),box=row.querySelector('.suggest');if(box&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();e.stopImmediatePropagation();moveDamageSelection(box,e.key==='ArrowDown'?1:-1);return}if(box&&e.key==='Enter'){const selected=box.querySelector('.opt.selected');if(selected){e.preventDefault();e.stopImmediatePropagation();chooseDamageItem(row,matchingDamageItems(input)[+selected.dataset.i]);return}}if(!['Enter','ArrowUp','ArrowDown'].includes(e.key))return;const all=[...rows.children],ri=all.indexOf(row),col=+input.dataset.col;let targetRow=ri,targetCol=col;if(e.key==='ArrowUp')targetRow--;else if(e.key==='ArrowDown')targetRow++;else if(e.shiftKey){targetCol--;if(targetCol<0){targetRow--;targetCol=3}}else{targetCol++;if(targetCol>3){targetRow++;targetCol=0}}if(targetRow<0)return;e.preventDefault();if(targetRow>=all.length)targetRow=[...rows.children].indexOf(addRow());const target=[...rows.children][targetRow]?.querySelector(`[data-col="${targetCol}"]`);if(target){target.focus();target.select();target.scrollIntoView({block:'nearest',behavior:'smooth'})}},true);
function installDamagePrintStyles(){const style=document.createElement('style');style.textContent=`#damagePrintSheet{display:none;position:fixed;left:-10000px;top:0;width:900px;padding:24px;background:#fff;color:#111;font:14px Arial,sans-serif}#damagePrintSheet h2{margin:0}#damagePrintSheet .title{text-align:center;border-bottom:2px solid #111;padding-bottom:10px}#damagePrintSheet .meta{display:flex;justify-content:space-between;gap:16px;margin:12px 0;font-weight:bold}#damagePrintSheet table{width:100%;border-collapse:collapse}#damagePrintSheet th,#damagePrintSheet td{border:1px solid #111;padding:7px;text-align:left}#damagePrintSheet th{background:#eee}#damagePrintSheet .right{text-align:right}#damagePrintSheet .total{margin-top:12px;text-align:right;font-weight:bold}@media print{body>*:not(#damagePrintSheet){display:none!important}#damagePrintSheet{display:block!important;position:static!important;width:100%!important;padding:0!important}@page{size:A4 portrait;margin:10mm}}`;document.head.appendChild(style)}
function buildDamagePrintSheet(snapshot){let sheet=document.getElementById('damagePrintSheet');if(!sheet){sheet=document.createElement('div');sheet.id='damagePrintSheet';document.body.appendChild(sheet)}const show=snapshot.showLanding;sheet.innerHTML=`<div class="title"><h2>VAJRA LIGHTS &amp; ELECTRICALS</h2><b>DAMAGE ENTRY</b></div><div class="meta"><span>Date: ${esc(snapshot.damage_date)}</span><span>${snapshot.supplier_name?'Supplier: '+esc(snapshot.supplier_name):''}</span><span>${snapshot.reference_no?'Reference: '+esc(snapshot.reference_no):''}</span></div>${snapshot.remark?`<p>Remark: ${esc(snapshot.remark)}</p>`:''}<table><thead><tr><th>#</th><th>Item Code</th><th>Item Name</th><th class="right">Qty</th>${show?'<th class="right">Landing / Unit</th><th class="right">Line Cost</th>':''}<th>Reason</th></tr></thead><tbody>${snapshot.items.map((item,index)=>`<tr><td>${index+1}</td><td>${esc(item.item_code)}</td><td>${esc(item.item_name)}</td><td class="right">${formatDamageQuantity(item.quantity)}</td>${show?`<td class="right">₹${formatDamageMoney(item.landing_unit)}</td><td class="right">₹${formatDamageMoney(item.landing_total)}</td>`:''}<td>${esc(item.reason||'')}</td></tr>`).join('')}</tbody></table><div class="total">Total quantity: ${formatDamageQuantity(snapshot.items.reduce((sum,item)=>sum+item.quantity,0))}${show?`<br>Total landing cost: ₹${formatDamageMoney(snapshot.items.reduce((sum,item)=>sum+item.landing_total,0))}`:''}</div>`;sheet.style.display='block';return sheet}
function collectDamageSnapshot(){const items=[...rows.children].map(row=>{const item_code=row.querySelector('.code').value.trim(),item_name=row.querySelector('.name').value.trim(),quantity=Number(row.querySelector('.qty').value),reason=row.querySelector('.reason').value.trim();return{item_code,item_name,quantity,reason,landing_unit:landingForCode(item_code),landing_total:landingForCode(item_code)*quantity}}).filter(item=>item.item_code||item.item_name);if(!items.length){setStatus('Enter at least one damaged item.',true);return null}if(items.some(item=>!item.item_code||!item.item_name||!(item.quantity>0))){setStatus('Every item needs a code, name and quantity above zero.',true);return null}return{items,damage_date:damageDate.value,supplier_name:supplier.value.trim(),reference_no:reference.value.trim(),remark:commonRemark.value.trim(),showLanding:document.body.classList.contains('show-landing')}}
function resetDamageEntry(){rows.innerHTML='';supplier.value=reference.value=commonRemark.value='';addRow();addRow();updateLandingDisplay()}
async function shareDamageImage(snapshot,whatsappWindow){const sheet=buildDamagePrintSheet(snapshot);const canvas=await html2canvas(sheet,{scale:2,backgroundColor:'#fff'});const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));if(!blob)throw new Error('Could not create the damage image.');const file=new File([blob],`damage_entry_${snapshot.damage_date}.png`,{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){try{await navigator.share({title:'Damage Entry',text:'Damage entry details',files:[file]});whatsappWindow?.close();setStatus('Damage entry saved. Share sheet opened.');return}catch(error){if(error.name==='AbortError'){whatsappWindow?.close();setStatus('Damage entry saved. Sharing was cancelled.');return}}}const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=file.name;link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);if(whatsappWindow&&!whatsappWindow.closed)whatsappWindow.location.href='https://wa.me/?text='+encodeURIComponent('Please attach the downloaded damage entry image.');setStatus('Damage entry saved. Image downloaded; attach it in WhatsApp.')}
async function saveDamageAction(action){const snapshot=collectDamageSnapshot();if(!snapshot)return;const whatsappWindow=action==='whatsapp'?window.open('about:blank','_blank'):null;const buttons=[printSaveBtn,whatsappSaveBtn];buttons.forEach(button=>button.disabled=true);setStatus('Saving...');try{const payload=snapshot.items.map(item=>({item_code:item.item_code,item_name:item.item_name,quantity:item.quantity,reason:item.reason||null,damage_date:snapshot.damage_date,supplier_name:snapshot.supplier_name||null,reference_no:snapshot.reference_no||null,remark:snapshot.remark||null,status:'OPEN'}));const {error}=await sb.from('damage_entries').insert(payload);if(error){whatsappWindow?.close();setStatus(`${error.message}. Run supabase_damage_entries.sql in Supabase if the table is not installed.`,true);return}resetDamageEntry();if(action==='print'){buildDamagePrintSheet(snapshot);window.print();setStatus(`${snapshot.items.length} damage item(s) saved. Stock was not changed.`)}else{try{await shareDamageImage(snapshot,whatsappWindow)}catch(error){whatsappWindow?.close();setStatus(`Damage saved, but image sharing failed: ${error.message}`,true)}}}catch(error){whatsappWindow?.close();setStatus(error.message||'Unable to save damage entry.',true)}finally{buttons.forEach(button=>button.disabled=false)}}
toggleLanding.onclick=()=>setLandingVisibility(landingSummary.hidden);addBtn.onclick=()=>addRow().querySelector('.name').focus();printSaveBtn.onclick=()=>saveDamageAction('print');whatsappSaveBtn.onclick=()=>saveDamageAction('whatsapp');
function setStatus(t,bad=false){statusEl.textContent=t;statusEl.className='status'+(bad?' err':'')}
</script></body></html>
