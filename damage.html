<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Damage Entry - VAJRA LIGHTS</title><link rel="icon" href="favicon.ico">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabaseClient.js"></script><script src="page_permissions.js"></script><script src="common-ui.js"></script>
<style>
:root{--blue:#2563eb;--ink:#17213a;--muted:#64748b;--line:#dbe3ef;--bg:#eef4fb;--red:#dc2626}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#f8fbff,var(--bg));color:var(--ink);font:14px "Segoe UI",Arial,sans-serif}.wrap{max-width:1450px;margin:auto;padding:18px}.top,.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.top h1{margin:0}.sub{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 32px #1e3a5f14;padding:16px;margin-top:14px}.fields{display:grid;grid-template-columns:150px 1fr 1fr 2fr;gap:12px}.field label{display:block;color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;margin-bottom:5px}input,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 11px;font:inherit;outline:none}input:focus,textarea:focus{border-color:#6ea1ff;box-shadow:0 0 0 3px #2563eb1a}.tablebox{overflow:visible;margin-top:12px}.grid{display:grid;grid-template-columns:45px 150px minmax(280px,1fr) 110px 1fr 52px;gap:8px;align-items:center}.hdr{color:var(--muted);font-size:11px;font-weight:900;text-transform:uppercase;padding:0 8px 7px}.row{position:relative;padding:8px;margin-bottom:8px;border:1px solid var(--line);border-radius:12px;background:#fbfdff}.num{text-align:center;font-weight:800}.qty{text-align:right}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(#3b82f6,#2563eb);color:#fff}.green{background:linear-gradient(#22c55e,#16a34a);color:#fff}.soft{background:#eaf1ff;color:#1d4ed8}.danger{background:#fee2e2;color:#991b1b;padding:9px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.status{margin-top:12px;padding:10px;border-radius:10px;background:#eff6ff;color:#1e40af;font-weight:700}.status.err{background:#fee2e2;color:#991b1b}.suggest{position:absolute;z-index:50;left:203px;right:178px;top:51px;max-height:260px;overflow:auto;background:white;border:1px solid #9db8e4;border-radius:10px;box-shadow:0 15px 35px #0f172a30}.opt{padding:9px 11px;border-bottom:1px solid #edf2f7;cursor:pointer}.opt:hover{background:#eff6ff}.opt small{display:block;color:var(--muted);margin-top:2px}@media(max-width:800px){.fields{grid-template-columns:1fr}.grid{grid-template-columns:35px 100px minmax(210px,1fr) 80px 150px 42px;min-width:700px}.tablebox{overflow:auto}.suggest{left:151px;right:140px}.actions .btn{flex:1}}
.row:focus-within{border-color:#93b4ec;background:#f8fbff}.suggest{max-height:280px}.suggest table{width:100%;border-collapse:collapse}.suggest th{position:sticky;top:0;background:#eaf1ff;color:#475569;text-align:left;padding:7px 10px;font-size:11px;text-transform:uppercase}.suggest td{padding:9px 10px;border-top:1px solid #edf2f7}.suggest .opt{cursor:pointer}.suggest .opt:hover td,.suggest .opt.selected td{background:#dbeafe;color:#1e3a8a}.suggest .empty{padding:10px;color:var(--muted)}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Damage Entry</h1><div class="sub">Record damaged products only — stock will not be adjusted.</div></div><div class="actions"><button class="btn soft" onclick="location.href='purchase_report.html'">Purchase Report</button><button class="btn soft" onclick="location.href='damage_report.html'">Damage Report</button></div></div>
<section class="card"><div class="fields"><div class="field"><label>Damage Date</label><input id="damageDate" type="date"></div><div class="field"><label>Supplier / Company</label><input id="supplier" placeholder="Optional"></div><div class="field"><label>Invoice / Reference</label><input id="reference" placeholder="Optional"></div><div class="field"><label>Common Remark</label><input id="commonRemark" placeholder="Optional note for this entry"></div></div></section>
<section class="card"><div class="head"><div><b>Damaged Items</b><div class="sub">Search by code or item name. Add the same item again if needed.</div></div><button class="btn soft" id="addBtn">+ Add Row</button></div><div class="tablebox"><div class="grid hdr"><div>#</div><div>Item Code</div><div>Item Name / Search</div><div>Damage Qty</div><div>Reason / Item Remark</div><div></div></div><div id="rows"></div></div><div class="actions"><button class="btn green" id="saveBtn">Save Damage Entry</button><button class="btn soft" id="clearBtn">Clear</button></div><div class="status" id="status">Loading item list...</div></section>
</div><script>
const sb=window.sbcc;let stock=[],seq=0;const rows=document.getElementById('rows'),statusEl=document.getElementById('status');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.addEventListener('DOMContentLoaded',async()=>{if(!await requirePageAccess('purchase'))return;damageDate.value=new Date().toISOString().slice(0,10);addRow();addRow();await loadStock()});
async function loadStock(){stock=[];for(let from=0;;from+=1000){const {data,error}=await sb.from('stock_balance_view').select('item_code,item_name,barcode').order('item_name').range(from,from+999);if(error){setStatus(error.message,true);return}stock.push(...(data||[]));if(!data||data.length<1000)break}const unique=new Map;stock.forEach(x=>unique.set(String(x.item_code||x.item_name).toUpperCase(),x));stock=[...unique.values()];setStatus(`${stock.length} items ready. Damage entries do not change stock.`)}
function addRow(){const id=++seq,el=document.createElement('div');el.className='grid row';el.dataset.id=id;el.innerHTML=`<div class="num"></div><input class="code" autocomplete="off"><div style="position:relative"><input class="name" autocomplete="off" placeholder="Type item name or code"></div><input class="qty" type="number" min="0.001" step="0.001" value="1"><input class="reason" placeholder="Damage reason / remark"><button class="btn danger" title="Remove">×</button>`;rows.appendChild(el);el.querySelector('.danger').onclick=()=>{el.remove();renumber()};['.name','.code'].forEach(s=>el.querySelector(s).addEventListener('input',()=>showSuggestions(el,s)));el.querySelector('.name').addEventListener('blur',()=>setTimeout(()=>el.querySelector('.suggest')?.remove(),180));el.querySelector('.code').addEventListener('blur',()=>setTimeout(()=>el.querySelector('.suggest')?.remove(),180));renumber();return el}
function renumber(){[...rows.children].forEach((r,i)=>r.querySelector('.num').textContent=i+1)}
function showSuggestions(row,selector){row.querySelector('.suggest')?.remove();const q=row.querySelector(selector).value.trim().toLowerCase();if(!q)return;const found=stock.filter(x=>`${x.item_code||''} ${x.item_name||''} ${x.barcode||''}`.toLowerCase().includes(q)).slice(0,12);const box=document.createElement('div');box.className='suggest';box.innerHTML=found.length?found.map((x,i)=>`<div class="opt" data-i="${i}"><b>${esc(x.item_name)}</b><small>${esc(x.item_code)}${x.barcode?' · '+esc(x.barcode):''}</small></div>`).join(''):'<div class="opt">No matching item</div>';row.appendChild(box);box.querySelectorAll('[data-i]').forEach(o=>o.onclick=()=>{const x=found[+o.dataset.i];row.querySelector('.code').value=x.item_code||'';row.querySelector('.name').value=x.item_name||'';box.remove();row.querySelector('.qty').focus();row.querySelector('.qty').select()})}
// Match the item picker and Excel-like keyboard movement used in newsoq.html.
function createDamageRow(){const id=++seq,el=document.createElement('div');el.className='grid row';el.dataset.id=id;el.innerHTML=`<div class="num"></div><input class="code nav" data-col="0" autocomplete="off"><div style="position:relative"><input class="name nav" data-col="1" autocomplete="off" placeholder="Type item name or code"></div><input class="qty nav" data-col="2" type="number" min="0.001" step="0.001" value="1"><input class="reason nav" data-col="3" placeholder="Damage reason / remark"><button class="btn danger" title="Remove">&times;</button>`;rows.appendChild(el);el.querySelector('.danger').onclick=()=>{el.remove();renumber()};['.name','.code'].forEach(s=>{const input=el.querySelector(s);input.addEventListener('input',()=>renderDamageSuggestions(el,s));input.addEventListener('blur',()=>setTimeout(()=>el.querySelector('.suggest')?.remove(),180))});renumber();return el}
addRow=createDamageRow;
function matchingDamageItems(input){const q=input.value.trim().toLowerCase();return q?stock.filter(x=>`${x.item_code||''} ${x.item_name||''} ${x.barcode||''}`.toLowerCase().includes(q)).slice(0,12):[]}
function chooseDamageItem(row,item){if(!item)return;row.querySelector('.code').value=item.item_code||'';row.querySelector('.name').value=item.item_name||'';row.querySelector('.suggest')?.remove();const qty=row.querySelector('.qty');qty.focus();qty.select()}
function renderDamageSuggestions(row,selector){row.querySelector('.suggest')?.remove();const input=row.querySelector(selector),found=matchingDamageItems(input);if(!input.value.trim())return;const box=document.createElement('div');box.className='suggest';box.innerHTML=found.length?`<table><thead><tr><th>Item</th><th>Code</th><th>Barcode</th></tr></thead><tbody>${found.map((x,i)=>`<tr class="opt${i===0?' selected':''}" data-i="${i}"><td>${esc(x.item_name)}</td><td>${esc(x.item_code)}</td><td>${esc(x.barcode||'')}</td></tr>`).join('')}</tbody></table>`:'<div class="empty">No matching item</div>';row.appendChild(box);box.querySelectorAll('.opt').forEach(o=>o.onmousedown=e=>{e.preventDefault();chooseDamageItem(row,found[+o.dataset.i])})}
function moveDamageSelection(box,step){const opts=[...box.querySelectorAll('.opt')];if(!opts.length)return;let i=opts.findIndex(o=>o.classList.contains('selected'));i=Math.max(0,Math.min(opts.length-1,i+step));opts.forEach((o,n)=>o.classList.toggle('selected',n===i));opts[i].scrollIntoView({block:'nearest'})}
rows.addEventListener('keydown',e=>{const input=e.target.closest('.nav');if(!input)return;const row=input.closest('.row'),box=row.querySelector('.suggest');if(box&&(e.key==='ArrowDown'||e.key==='ArrowUp')){e.preventDefault();e.stopImmediatePropagation();moveDamageSelection(box,e.key==='ArrowDown'?1:-1);return}if(box&&e.key==='Enter'){const selected=box.querySelector('.opt.selected');if(selected){e.preventDefault();e.stopImmediatePropagation();chooseDamageItem(row,matchingDamageItems(input)[+selected.dataset.i]);return}}if(!['Enter','ArrowUp','ArrowDown'].includes(e.key))return;const all=[...rows.children],ri=all.indexOf(row),col=+input.dataset.col;let targetRow=ri,targetCol=col;if(e.key==='ArrowUp')targetRow--;else if(e.key==='ArrowDown')targetRow++;else if(e.shiftKey){targetCol--;if(targetCol<0){targetRow--;targetCol=3}}else{targetCol++;if(targetCol>3){targetRow++;targetCol=0}}if(targetRow<0)return;e.preventDefault();if(targetRow>=all.length)targetRow=[...rows.children].indexOf(addRow());const target=[...rows.children][targetRow]?.querySelector(`[data-col="${targetCol}"]`);if(target){target.focus();target.select();target.scrollIntoView({block:'nearest',behavior:'smooth'})}},true);
addBtn.onclick=()=>addRow().querySelector('.name').focus();clearBtn.onclick=()=>{if(!confirm('Clear this damage entry?'))return;rows.innerHTML='';supplier.value=reference.value=commonRemark.value='';addRow();addRow();setStatus('Entry cleared.')};
saveBtn.onclick=async()=>{const items=[...rows.children].map(r=>({item_code:r.querySelector('.code').value.trim(),item_name:r.querySelector('.name').value.trim(),quantity:Number(r.querySelector('.qty').value),reason:r.querySelector('.reason').value.trim()})).filter(x=>x.item_code||x.item_name);if(!items.length)return setStatus('Enter at least one damaged item.',true);if(items.some(x=>!x.item_code||!x.item_name||!(x.quantity>0)))return setStatus('Every item needs a code, name and quantity above zero.',true);saveBtn.disabled=true;setStatus('Saving...');const payload=items.map(x=>({...x,damage_date:damageDate.value,supplier_name:supplier.value.trim()||null,reference_no:reference.value.trim()||null,remark:commonRemark.value.trim()||null,status:'OPEN'}));const {error}=await sb.from('damage_entries').insert(payload);saveBtn.disabled=false;if(error)return setStatus(`${error.message}. Run supabase_damage_entries.sql in Supabase if the table is not installed.`,true);setStatus(`${items.length} damage item(s) saved. Stock was not changed.`);rows.innerHTML='';supplier.value=reference.value=commonRemark.value='';addRow();addRow()};
function setStatus(t,bad=false){statusEl.textContent=t;statusEl.className='status'+(bad?' err':'')}
</script></body></html>
